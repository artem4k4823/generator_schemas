                const dist = getTouchDist(e.touches[0], e.touches[1]);
                if (initialPinchDist > 0) {
                    const newScale = Math.min(3.5, Math.max(0.18, initialPinchScale * (dist / initialPinchDist)));
                    const rect = canvasViewport.getBoundingClientRect();
                    const midX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - rect.left;
                    const midY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - rect.top;

                    panX = midX - (midX - panX) * (newScale / scale);
                    panY = midY - (midY - panY) * (newScale / scale);
                    scale = newScale;
                    applyTransform();
                }
            }
        }, { passive: false });

        canvasViewport.addEventListener('touchend', (e) => {
            if (e.touches.length === 0) {
                touchMode = null;
            } else if (e.touches.length === 1) {
                touchMode = 'pan';
                lastTouchX = e.touches[0].clientX - panX;
                lastTouchY = e.touches[0].clientY - panY;
            }
        });

        document.getElementById('btnZoomIn').addEventListener('click', () => {
            const rect = canvasViewport.getBoundingClientRect();
            const cx = rect.width / 2;
            const cy = rect.height / 2;
            const newScale = Math.min(3.5, scale * 1.25);
            panX = cx - (cx - panX) * (newScale / scale);
            panY = cy - (cy - panY) * (newScale / scale);
            scale = newScale;
            applyTransform();
        });

        document.getElementById('btnZoomOut').addEventListener('click', () => {
            const rect = canvasViewport.getBoundingClientRect();
            const cx = rect.width / 2;
            const cy = rect.height / 2;
            const newScale = Math.max(0.18, scale / 1.25);
            panX = cx - (cx - panX) * (newScale / scale);
            panY = cy - (cy - panY) * (newScale / scale);
            scale = newScale;
            applyTransform();
        });

        document.getElementById('btnFitView').addEventListener('click', fitDiagramToViewport);

        // Controls & Toggles
        presetSelect.addEventListener('change', () => {
            const key = presetSelect.value;
            if (JAVA_PRESETS[key]) {
                codeInput.value = JAVA_PRESETS[key];
                updateLineNumbers();
                compileAndRender(true);
            }
        });

        btnThemeToggle.addEventListener('click', () => {
            currentTheme = currentTheme === 'modern' ? 'gost' : 'modern';
            if (currentTheme === 'gost') {
                themeIndicator.className = 'w-2 h-2 rounded-full bg-white border border-slate-400';
                themeLabel.textContent = 'ГОСТ';
            } else {
                themeIndicator.className = 'w-2 h-2 rounded-full bg-indigo-400';
                themeLabel.textContent = 'Цвет';
            }
            compileAndRender(false);
        });

        btnHexToggle.addEventListener('click', () => {
            forAsHexagon = !forAsHexagon;
            btnHexToggle.textContent = forAsHexagon ? '⬡ ГОСТ' : '◇ Ромб';
            btnHexToggle.className = forAsHexagon
                ? 'h-8 px-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-indigo-300 border border-slate-700 text-xs font-mono font-semibold transition shrink-0 whitespace-nowrap'
                : 'h-8 px-2.5 rounded-lg bg-slate-800 hover:bg-slate-700 active:bg-slate-600 text-amber-300 border border-slate-700 text-xs font-mono font-semibold transition shrink-0 whitespace-nowrap';
            compileAndRender(false);
        });

        methodSelect.addEventListener('change', () => compileAndRender(true));

        let debounceTimer = null;
        codeInput.addEventListener('input', () => {
            updateLineNumbers();
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => compileAndRender(false), 200);
        });

        codeInput.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = codeInput.selectionStart;
                const end = codeInput.selectionEnd;
                codeInput.value = codeInput.value.substring(0, start) + '    ' + codeInput.value.substring(end);
                codeInput.selectionStart = codeInput.selectionEnd = start + 4;
                updateLineNumbers();
            }
        });

        /********************************************************************
         * 7. EXPORT UTILITIES (SVG & HIGH-RES PNG)
         ********************************************************************/
        function buildStandaloneSvgString() {
            if (!currentLayout) return '';
            const w = Math.ceil(currentLayout.width);
            const h = Math.ceil(currentLayout.height);

            return `<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">
    <defs>${svgDefs.innerHTML}</defs>
    <rect width="100%" height="100%" fill="#ffffff"/>
    <g>${viewportGroup.innerHTML}</g>
</svg>`;
        }

        document.getElementById('btnExportSVG').addEventListener('click', () => {
            const svgStr = buildStandaloneSvgString();
            const blob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `flowchart_${currentParsedMethod?.methodName || 'java'}.svg`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });

        document.getElementById('btnExportPNG').addEventListener('click', () => {
            if (!currentLayout) return;
            const svgStr = buildStandaloneSvgString();
            const img = new Image();
            const svgBlob = new Blob([svgStr], { type: 'image/svg+xml;charset=utf-8' });
            const url = URL.createObjectURL(svgBlob);

            img.onload = () => {
                const scaleFactor = 2;
                const canvas = document.createElement('canvas');
                canvas.width = currentLayout.width * scaleFactor;
                canvas.height = currentLayout.height * scaleFactor;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.scale(scaleFactor, scaleFactor);
                ctx.drawImage(img, 0, 0);
                URL.revokeObjectURL(url);

                canvas.toBlob((pngBlob) => {
                    const pngUrl = URL.createObjectURL(pngBlob);
                    const link = document.createElement('a');
                    link.href = pngUrl;
                    link.download = `flowchart_${currentParsedMethod?.methodName || 'java'}.png`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    URL.revokeObjectURL(pngUrl);
                }, 'image/png');
            };
            img.src = url;
        });

        // Initialize on load & handle responsive orientation changes
        window.addEventListener('load', () => {
            codeInput.value = JAVA_PRESETS.quadratic;
            updateLineNumbers();
            compileAndRender(true);
        });

        window.addEventListener('resize', () => {
            if (window.innerWidth >= 768) {
                codePanel.classList.remove('hidden');
                codePanel.classList.add('flex');
                chartPanel.classList.remove('hidden');
                chartPanel.classList.add('flex');
                fitDiagramToViewport();
            } else {
                setMobileTab(activeMobileTab);
            }
        });
    </script>
</body>
</html>
