    <style>
        :root {
            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --font-gost: 'PT Serif', 'Times New Roman', serif;
        }
        body {
            font-family: var(--font-sans);
            overflow: hidden;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .code-editor {
            font-family: var(--font-mono);
            line-height: 1.5rem;
            tab-size: 4;
            -webkit-overflow-scrolling: touch;
        }
        .line-numbers {
            font-family: var(--font-mono);
            line-height: 1.5rem;
            user-select: none;
        }
        /* Grid background for canvas */
        .canvas-grid-modern {
            background-color: #f8fafc;
            background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
            background-size: 20px 20px;
        }
        .canvas-grid-gost {
            background-color: #ffffff;
            background-image: 
                linear-gradient(to right, #f1f5f9 1px, transparent 1px),
                linear-gradient(to bottom, #f1f5f9 1px, transparent 1px);
            background-size: 20px 20px;
        }
        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .node-hover:hover {
            filter: brightness(0.95);
            cursor: pointer;
        }
        .safe-bottom {
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }
    </style>
</head>

        /********************************************************************
         * 2. JAVA CONTROL-FLOW PARSER (PURE JS)
         * Converts Java source code into a structured Control-Flow AST
         ********************************************************************/
        class JavaParser {
            constructor() {
                this.nodeCounter = 1;
            }

            // Strip comments while preserving line numbers (\n)
            stripComments(code) {
                let out = '';
                let i = 0;
                let inString = false;
                let stringChar = '';

                while (i < code.length) {
                    const ch = code[i];
                    const next = code[i + 1];

                    if (inString) {
                        out += ch;
                        if (ch === '\\' && i + 1 < code.length) {
                            out += code[i + 1];
                            i += 2;
                            continue;
                        }
                        if (ch === stringChar) inString = false;
                        i++;
                        continue;
                    }

                    if (ch === '"' || ch === "'") {
                        inString = true;
                        stringChar = ch;
                        out += ch;
                        i++;
                        continue;
                    }

                    // Single line comment
                    if (ch === '/' && next === '/') {
                        while (i < code.length && code[i] !== '\n') i++;
                        continue;
                    }

                    // Multi-line comment
                    if (ch === '/' && next === '*') {
                        i += 2;
                        while (i < code.length && !(code[i] === '*' && code[i + 1] === '/')) {
                            if (code[i] === '\n') out += '\n';
                            i++;
                        }
                        i += 2;
                        continue;
                    }

                    out += ch;
                    i++;
                }
                return out;
            }

            // Find matching closing brace or parenthesis
            findMatching(str, startIdx, openChar = '{', closeChar = '}') {
                let depth = 0;
                let inString = false;
                let stringChar = '';

                for (let i = startIdx; i < str.length; i++) {
                    const ch = str[i];
                    if (inString) {
                        if (ch === '\\') { i++; continue; }
                        if (ch === stringChar) inString = false;
                        continue;
                    }
                    if (ch === '"' || ch === "'") {
                        inString = true;
                        stringChar = ch;
                        continue;
                    }
                    if (ch === openChar) depth++;
                    else if (ch === closeChar) {
                        depth--;
                        if (depth === 0) return i;
                    }
                }
                return -1;
            }

            getLineNumber(fullText, index) {
                let line = 1;
                for (let i = 0; i < index && i < fullText.length; i++) {
                    if (fullText[i] === '\n') line++;
                }
                return line;
            }

            // Extract methods from class or return top-level snippet
            extractMethods(rawCode) {
                const cleanCode = this.stripComments(rawCode);
                const methods = [];

                // Check if there is a class wrapper
                const classMatch = /\b(class|interface|enum)\s+\w+/g.exec(cleanCode);
                let searchArea = cleanCode;
                let baseOffset = 0;

                if (classMatch) {
                    const openBrace = cleanCode.indexOf('{', classMatch.index);
                    if (openBrace !== -1) {
                        const closeBrace = this.findMatching(cleanCode, openBrace, '{', '}');
                        if (closeBrace !== -1) {
                            searchArea = cleanCode.slice(openBrace + 1, closeBrace);
                            baseOffset = openBrace + 1;
                        }
                    }
                }

                // Regex to match method declarations
                const methodRegex = /(?:(?:public|private|protected|static|final|synchronized|abstract|native)\s+)*[\w<>\[\]]+\s+(\w+)\s*\(([^)]*)\)\s*(?:throws\s+[\w,\s]+)?\{/g;
                let match;

                while ((match = methodRegex.exec(searchArea)) !== null) {
                    const methodName = match[1];
                    if (['if', 'for', 'while', 'switch', 'catch', 'synchronized'].includes(methodName)) {
                        continue;
                    }
                    const params = match[2].trim();
                    const braceStart = match.index + match[0].length - 1;
                    const braceEnd = this.findMatching(searchArea, braceStart, '{', '}');

                    if (braceEnd !== -1) {
                        const body = searchArea.slice(braceStart + 1, braceEnd);
                        const bodyOffset = baseOffset + braceStart + 1;
                        methods.push({
                            name: `${methodName}(${params})`,
                            shortName: methodName,
                            params: params,
                            body: body,
                            offset: bodyOffset,
                            cleanFull: cleanCode
                        });
                        methodRegex.lastIndex = braceEnd + 1;
                    }
                }

                if (methods.length === 0) {
                    // Fallback: treat entire code (excluding import/package) as snippet
                    methods.push({
                        name: 'main (Фрагмент кода)',
                        shortName: 'main',
                        params: '',
                        body: cleanCode,
                        offset: 0,
                        cleanFull: cleanCode
                    });
                }

                return methods;
            }

            parseMethod(methodObj) {
                this.nodeCounter = 1;
                this.cleanFull = methodObj.cleanFull;
                const statements = this.parseBlock(methodObj.body, methodObj.offset);
                return {
                    methodName: methodObj.shortName,
                    params: methodObj.params,
                    body: statements
                };
            }

            // Parse a block of statements recursively
            parseBlock(text, baseOffset) {
                const nodes = [];
                let i = 0;
                const len = text.length;

                const skipWhitespace = () => {
                    while (i < len && /\s/.test(text[i])) i++;
                };

                const readStatementUntilSemicolon = (startIdx) => {
                    let inStr = false;
                    let strCh = '';
                    let parenDepth = 0;
                    for (let k = startIdx; k < len; k++) {
                        const c = text[k];
                        if (inStr) {
                            if (c === '\\') { k++; continue; }
                            if (c === strCh) inStr = false;
                            continue;
                        }
                        if (c === '"' || c === "'") { inStr = true; strCh = c; continue; }
                        if (c === '(') parenDepth++;
                        if (c === ')') parenDepth = Math.max(0, parenDepth - 1);
                        if (c === ';' && parenDepth === 0) return k;
                        if (c === '{' && parenDepth === 0) return k; // safety fallback
                    }
                    return len;
                };

                const parseSingleOrBracedBody = () => {
                    skipWhitespace();
                    if (i >= len) return [];
                    if (text[i] === '{') {
                        const closeIdx = this.findMatching(text, i, '{', '}');
                        if (closeIdx === -1) {
                            const sub = this.parseBlock(text.slice(i + 1), baseOffset + i + 1);
                            i = len;
                            return sub;
                        }
                        const sub = this.parseBlock(text.slice(i + 1, closeIdx), baseOffset + i + 1);
                        i = closeIdx + 1;
                        return sub;
                    } else {
                        // Single statement without braces
                        const stmtStart = i;
                        // Check if single statement is another control structure
                        if (/^(if|for|while|do|switch)\b/.test(text.slice(i))) {
                            // Let recursive call handle up to one control statement
                            const sub = this.parseSingleControlOrStmt(text, i, baseOffset);
                            i = sub.nextIdx;
                            return sub.nodes;
                        }
                        const semi = readStatementUntilSemicolon(i);
                        const rawStmt = text.slice(stmtStart, semi).trim();
                        const line = this.getLineNumber(this.cleanFull, baseOffset + stmtStart);
                        i = semi + 1;
                        const classified = this.classifySimpleStatement(rawStmt, line);
                        return classified ? [classified] : [];
                    }
                };

                while (i < len) {
                    skipWhitespace();
                    if (i >= len) break;

                    if (text[i] === ';') {
                        i++;
                        continue;
                    }

                    // Nested bare block
                    if (text[i] === '{') {
                        const closeIdx = this.findMatching(text, i, '{', '}');
                        if (closeIdx !== -1) {
                            nodes.push(...this.parseBlock(text.slice(i + 1, closeIdx), baseOffset + i + 1));
                            i = closeIdx + 1;
                            continue;
                        }
                    }

                    const rest = text.slice(i);
                    const currentLine = this.getLineNumber(this.cleanFull, baseOffset + i);

                    // 1. IF / ELSE IF / ELSE
                    const ifMatch = /^if\s*\(/.exec(rest);
                    if (ifMatch) {
                        const openParen = i + ifMatch[0].length - 1;
                        const closeParen = this.findMatching(text, openParen, '(', ')');
                        const cond = closeParen !== -1 ? text.slice(openParen + 1, closeParen).trim() : 'условие';
                        i = closeParen !== -1 ? closeParen + 1 : i + ifMatch[0].length;

                        const thenBranch = parseSingleOrBracedBody();
                        let elseBranch = [];

                        skipWhitespace();
                        const elseMatch = /^else\b/.exec(text.slice(i));
                        if (elseMatch) {
                            i += elseMatch[0].length;
                            skipWhitespace();
                            // Check if it's an `else if`
                            if (/^if\s*\(/.test(text.slice(i))) {
                                const nestedIf = this.parseSingleControlOrStmt(text, i, baseOffset);
                                elseBranch = nestedIf.nodes;
                                i = nestedIf.nextIdx;
                            } else {
                                elseBranch = parseSingleOrBracedBody();
                            }
                        }

                        nodes.push({
                            id: `node_${this.nodeCounter++}`,
                            type: 'if',
                            condition: this.formatExpression(cond),
                            thenBranch,
                            elseBranch,
                            line: currentLine
                        });
                        continue;
                    }

                    // 2. FOR LOOP
                    const forMatch = /^for\s*\(/.exec(rest);
                    if (forMatch) {
                        const openParen = i + forMatch[0].length - 1;
                        const closeParen = this.findMatching(text, openParen, '(', ')');
                        const header = closeParen !== -1 ? text.slice(openParen + 1, closeParen).trim() : '';
                        i = closeParen !== -1 ? closeParen + 1 : i + forMatch[0].length;

                        const body = parseSingleOrBracedBody();
                        let init = '', condition = '', step = '';

                        if (header.includes(';')) {
                            const parts = header.split(';');
                            init = this.formatExpression((parts[0] || '').trim());
                            condition = this.formatExpression((parts[1] || '').trim());
                            step = this.formatExpression((parts.slice(2).join(';') || '').trim());
                        } else {
                            // Enhanced for-each loop: for (int x : arr)
                            condition = this.formatExpression(header);
                        }

                        nodes.push({
                            id: `node_${this.nodeCounter++}`,
                            type: 'for',
                            header: this.formatExpression(header),
                            init,
                            condition: condition || 'true',
                            step,
                            body,
                            line: currentLine
                        });
                        continue;
                    }

                    // 3. WHILE LOOP
                    const whileMatch = /^while\s*\(/.exec(rest);
                    if (whileMatch) {
                        const openParen = i + whileMatch[0].length - 1;
                        const closeParen = this.findMatching(text, openParen, '(', ')');
                        const cond = closeParen !== -1 ? text.slice(openParen + 1, closeParen).trim() : 'условие';
                        i = closeParen !== -1 ? closeParen + 1 : i + whileMatch[0].length;

                        const body = parseSingleOrBracedBody();
                        nodes.push({
                            id: `node_${this.nodeCounter++}`,
                            type: 'while',
                            condition: this.formatExpression(cond),
                            body,
                            line: currentLine
                        });
                        continue;
                    }

                    // 4. DO-WHILE LOOP
                    const doMatch = /^do\b/.exec(rest);
                    if (doMatch) {
                        i += doMatch[0].length;
                        const body = parseSingleOrBracedBody();
                        skipWhitespace();
                        let cond = 'условие';
                        const afterWhile = /^while\s*\(/.exec(text.slice(i));
                        if (afterWhile) {
                            const openParen = i + afterWhile[0].length - 1;
                            const closeParen = this.findMatching(text, openParen, '(', ')');
                            if (closeParen !== -1) {
                                cond = text.slice(openParen + 1, closeParen).trim();
                                i = closeParen + 1;
                            }
                            skipWhitespace();
                            if (text[i] === ';') i++;
                        }
                        nodes.push({
                            id: `node_${this.nodeCounter++}`,
                            type: 'doWhile',
                            condition: this.formatExpression(cond),
                            body,
                            line: currentLine
                        });
                        continue;
                    }

                    // 5. SWITCH STATEMENT (Converted to chained if/else AST for clean GOST flowcharting)
                    const switchMatch = /^switch\s*\(/.exec(rest);
                    if (switchMatch) {
                        const openParen = i + switchMatch[0].length - 1;
                        const closeParen = this.findMatching(text, openParen, '(', ')');
                        const switchExpr = closeParen !== -1 ? text.slice(openParen + 1, closeParen).trim() : 'выражение';
                        i = closeParen !== -1 ? closeParen + 1 : i + switchMatch[0].length;
                        skipWhitespace();
                        if (text[i] === '{') {
                            const closeBrace = this.findMatching(text, i, '{', '}');
                            const switchBody = closeBrace !== -1 ? text.slice(i + 1, closeBrace) : '';
                            const switchNode = this.parseSwitchBody(switchExpr, switchBody, baseOffset + i + 1, currentLine);
                            if (switchNode) nodes.push(switchNode);
                            i = closeBrace !== -1 ? closeBrace + 1 : len;
                            continue;
                        }
                    }

                    // 6. TRY / CATCH (Parse try body seamlessly)
                    const tryMatch = /^try\b/.exec(rest);
                    if (tryMatch) {
                        i += tryMatch[0].length;
                        const tryNodes = parseSingleOrBracedBody();
                        nodes.push(...tryNodes);
                        skipWhitespace();
                        while (/^(catch|finally)\b/.test(text.slice(i))) {
                            const kw = /^(catch|finally)\b/.exec(text.slice(i))[0];
                            i += kw.length;
                            skipWhitespace();
                            if (text[i] === '(') {
                                const cp = this.findMatching(text, i, '(', ')');
                                if (cp !== -1) i = cp + 1;
                            }
                            parseSingleOrBracedBody();
                            skipWhitespace();
                        }
                        continue;
                    }

                    // 7. SIMPLE STATEMENT (Assignment, I/O, Return, Method call)
                    const semiIdx = readStatementUntilSemicolon(i);
                    const stmtText = text.slice(i, semiIdx).trim();
                    i = semiIdx + 1;

                    const node = this.classifySimpleStatement(stmtText, currentLine);
                    if (node) nodes.push(node);
                }

                return nodes;
            }

            parseSingleControlOrStmt(text, startIdx, baseOffset) {
                // Helper to parse exactly one statement or control structure starting at startIdx
                let tempI = startIdx;
                const rest = text.slice(tempI);

                if (/^if\s*\(/.test(rest)) {
                    // Find extent of if + optional else
                    const m = /^if\s*\(/.exec(rest);
                    let p = this.findMatching(text, tempI + m[0].length - 1, '(', ')');
                    p = this.skipBodyExtent(text, p + 1);
                    while (p < text.length && /\s/.test(text[p])) p++;
                    while (/^else\b/.test(text.slice(p))) {
                        p += 4;
                        while (p < text.length && /\s/.test(text[p])) p++;
                        if (/^if\s*\(/.test(text.slice(p))) {
                            const m2 = /^if\s*\(/.exec(text.slice(p));
                            p = this.findMatching(text, p + m2[0].length - 1, '(', ')');
                            p = this.skipBodyExtent(text, p + 1);
                        } else {
                            p = this.skipBodyExtent(text, p);
                        }
                        while (p < text.length && /\s/.test(text[p])) p++;
                    }
                    return {
                        nodes: this.parseBlock(text.slice(startIdx, p), baseOffset + startIdx),
                        nextIdx: p
                    };
                }

                const end = this.skipBodyExtent(text, startIdx);
                return {
                    nodes: this.parseBlock(text.slice(startIdx, end), baseOffset + startIdx),
                    nextIdx: end
                };
            }

            skipBodyExtent(text, idx) {
                let i = idx;
                while (i < text.length && /\s/.test(text[i])) i++;
                if (text[i] === '{') {
                    const close = this.findMatching(text, i, '{', '}');
                    return close !== -1 ? close + 1 : text.length;
                }
                while (i < text.length && text[i] !== ';') i++;
                return Math.min(text.length, i + 1);
            }

            parseSwitchBody(switchExpr, bodyText, baseOffset, switchLine) {
                const caseRegex = /(?:case\s+([^:]+)|default)\s*:/g;
                const matches = [];
                let m;
                while ((m = caseRegex.exec(bodyText)) !== null) {
                    matches.push({
                        val: m[1] ? m[1].trim() : null, // null means default
                        start: m.index + m[0].length,
                        headerStart: m.index
                    });
                }
                if (matches.length === 0) return null;

                let rootIf = null;
                let currentIf = null;

                for (let idx = 0; idx < matches.length; idx++) {
                    const cur = matches[idx];
                    const nextStart = idx + 1 < matches.length ? matches[idx + 1].headerStart : bodyText.length;
                    const rawBlock = bodyText.slice(cur.start, nextStart);
                    const parsedStmts = this.parseBlock(rawBlock, baseOffset + cur.start)
                        .filter(n => n.type !== 'break');

                    const line = this.getLineNumber(this.cleanFull, baseOffset + cur.headerStart);

                    if (cur.val !== null) {
                        const newIf = {
                            id: `node_${this.nodeCounter++}`,
                            type: 'if',
                            condition: `${switchExpr} == ${cur.val}`,
                            thenBranch: parsedStmts,
                            elseBranch: [],
                            line
                        };
                        if (!rootIf) {
                            rootIf = newIf;
                            currentIf = newIf;
                        } else {
                            currentIf.elseBranch = [newIf];
                            currentIf = newIf;
                        }
                    } else {
                        // default branch
                        if (currentIf) {
                            currentIf.elseBranch = parsedStmts;
                        }
                    }
                }
                return rootIf;
            }

            classifySimpleStatement(stmt, line) {
                if (!stmt) return null;
                const clean = stmt.replace(/\s+/g, ' ').trim();

                // Ignore package, import, or Scanner instantiation noise
                if (/^(package|import)\s+/.test(clean)) return null;
                if (/^Scanner\s+\w+\s*=\s*new\s+Scanner\s*\(\s*System\.in\s*\)/.test(clean)) return null;
                if (clean === 'break') return { id: `node_${this.nodeCounter++}`, type: 'break', text: 'break', line };

                // 1. Return statement (Terminator shape)
                if (/^return\b/.test(clean)) {
                    const retVal = clean.replace(/^return\s*/, '').trim();
                    return {
                        id: `node_${this.nodeCounter++}`,
                        type: 'return',
                        text: retVal ? `Возврат ${retVal}` : 'Выход (return)',
                        line
                    };
                }

                // 2. Output statement: System.out.print / println / printf
                const outMatch = /^System\.out\.(?:println|print|printf)\s*\((.*)\)$/.exec(clean);
                if (outMatch) {
                    let arg = outMatch[1].trim();
                    return {
                        id: `node_${this.nodeCounter++}`,
                        type: 'io',
                        ioKind: 'out',
                        text: `Вывод: ${arg || '""'}`,
                        line
                    };
                }

                // 3. Input statement: scanner.nextInt(), nextDouble(), nextLine(), System.in
                const inMatch = /^(?:[\w\[\]]+\s+)?(\w+(?:\[[^\]]+\])?)\s*=\s*\w+\.next(?:Int|Double|Float|Long|Line|Boolean|Byte|Short)?\s*\([^)]*\)/.exec(clean);
                if (inMatch) {
                    return {
                        id: `node_${this.nodeCounter++}`,
                        type: 'io',
                        ioKind: 'in',
                        text: `Ввод ${inMatch[1]}`,
                        line
                    };
                }

                // 4. Standalone custom method call (Predefined Process / Subprogram)
                const callMatch = /^(\w+)\s*\((.*)\)$/.exec(clean);
                if (callMatch && !['if', 'for', 'while', 'switch'].includes(callMatch[1])) {
                    return {
                        id: `node_${this.nodeCounter++}`,
                        type: 'subprogram',
                        text: clean,
                        line
                    };
                }

                // 5. Standard Process block (variable assignment / declaration)
                let formatted = this.formatExpression(clean);
                return {
                    id: `node_${this.nodeCounter++}`,
                    type: 'process',
                    text: formatted,
                    line
                };
            }

            formatExpression(expr) {
                if (!expr) return '';
                // Strip leading primitive type declarations to keep blocks concise per GOST
                return expr
                    .replace(/^(?:final\s+)?(?:int|double|float|long|boolean|char|byte|short|String)\s*(\[\s*\])?\s+/, '')
                    .replace(/\s+/g, ' ')
                    .trim();
            }
        }

        /********************************************************************
         * 3. RECURSIVE GOST FLOWCHART LAYOUT ENGINE
         * Computes non-overlapping bounding boxes and orthogonal connectors
         ********************************************************************/
        class FlowchartLayoutEngine {
            constructor(options = {}) {
                this.forAsHexagon = options.forAsHexagon ?? true;
                this.nodeW = 190;
                this.nodeH = 52;
                this.vGap = 36;
                this.hGap = 56;
            }

            // Wrap long lines of text so they fit neatly inside shapes
            wrapText(text, maxChars = 22) {
                if (!text) return [''];
                const words = text.split(' ');
                const lines = [];
                let current = '';

                for (const word of words) {
                    if ((current + ' ' + word).trim().length <= maxChars) {
                        current = (current + ' ' + word).trim();
                    } else {
                        if (current) lines.push(current);
                        if (word.length > maxChars) {
                            // Hard split very long token
                            let rem = word;
                            while (rem.length > maxChars) {
                                lines.push(rem.slice(0, maxChars - 1) + '…');
                                rem = rem.slice(maxChars - 1);
                                if (lines.length >= 2) break;
                            }
                            current = rem;
                        } else {
                            current = word;
                        }
                    }
                    if (lines.length >= 3) break;
                }
                if (current && lines.length < 3) lines.push(current);
                return lines;
            }

            getNodeDimensions(node) {
                const isDiamond = ['if', 'while', 'doWhile'].includes(node.type) || (node.type === 'for' && !this.forAsHexagon);
                const text = node.condition || node.header || node.text || '';
                const lines = this.wrapText(text, isDiamond ? 18 : 24);

                let w = this.nodeW;
                let h = Math.max(this.nodeH, 28 + lines.length * 16);

                if (isDiamond) {
                    w = Math.max(210, w + 24);
                    h = Math.max(76, h + 22);
                } else if (node.type === 'for' && this.forAsHexagon) {
                    w = Math.max(210, w + 16);
                    h = Math.max(58, h + 6);
                } else if (node.type === 'terminator' || node.type === 'return') {
                    w = 160;
                    h = 46;
                }

                return { w, h, lines };
            }

            buildCompleteFlowchart(parsedMethod) {
                const fullSequence = [
                    {
                        id: 'start_node',
                        type: 'terminator',
                        text: parsedMethod.methodName && parsedMethod.methodName !== 'main'
                            ? `Начало ${parsedMethod.methodName}`
                            : 'Начало',
                        line: 1
                    },
                    ...parsedMethod.body
                ];

                // Add End terminator if the last statement is not already an explicit return
                const lastStmt = parsedMethod.body[parsedMethod.body.length - 1];
                if (!lastStmt || lastStmt.type !== 'return') {
                    fullSequence.push({
                        id: 'end_node',
                        type: 'terminator',
                        text: 'Конец',
                        line: null
                    });
                }

                const block = this.layoutSequence(fullSequence);
                // Add margin around the entire diagram
                const margin = 50;
                this.translateBlock(block, margin + block.leftExtent, margin);
                return {
                    width: block.leftExtent + block.rightExtent + margin * 2,
                    height: block.height + margin * 2,
                    shapes: block.shapes,
                    edges: block.edges
                };
            }

            translateBlock(block, dx, dy) {
                for (const s of block.shapes) {
                    s.cx += dx;
                    s.y += dy;
                }
                for (const e of block.edges) {
                    for (const pt of e.points) {
                        pt.x += dx;
                        pt.y += dy;
                    }
                    if (e.labelPos) {
                        e.labelPos.x += dx;
                        e.labelPos.y += dy;
                    }
                }
                for (const ex of block.openExits) {
                    ex.x += dx;
                    ex.y += dy;
                }
            }

            // Layout a list of sequential AST statements
            layoutSequence(nodes) {
                if (!nodes || nodes.length === 0) {
                    return {
                        leftExtent: 40,
                        rightExtent: 40,
                        height: 0,
                        shapes: [],
                        edges: [],
                        openExits: [{ x: 0, y: 0 }]
                    };
                }

                let currentY = 0;
                let maxLeft = 0;
                let maxRight = 0;
                const allShapes = [];
                const allEdges = [];
                let prevExits = null;

                for (let i = 0; i < nodes.length; i++) {
                    const sub = this.layoutNode(nodes[i]);
                    this.translateBlock(sub, 0, currentY);

                    maxLeft = Math.max(maxLeft, sub.leftExtent);
                    maxRight = Math.max(maxRight, sub.rightExtent);
                    allShapes.push(...sub.shapes);
                    allEdges.push(...sub.edges);

                    // Connect previous open exits into the top center (0, currentY) of this block
                    if (prevExits && prevExits.length > 0) {
                        for (const ex of prevExits) {
                            allEdges.push(this.connectExitToPoint(ex, { x: 0, y: currentY }, true));
                        }
                    }

                    prevExits = sub.openExits;

                    // If this is a return block, it terminates control flow on this path
                    if (nodes[i].type === 'return') {
                        prevExits = [];
                    }

                    currentY += sub.height;
                    if (i < nodes.length - 1) {
                        currentY += this.vGap;
                    }
                }

                return {
                    leftExtent: maxLeft,
                    rightExtent: maxRight,
                    height: currentY,
                    shapes: allShapes,
                    edges: allEdges,
                    openExits: prevExits || []
                };
            }

            connectExitToPoint(exit, target, arrowAtEnd = true) {
                const pts = [];
                pts.push({ x: exit.x, y: exit.y });

                if (exit.dir === 'right' || exit.dir === 'left') {
                    pts.push({ x: target.x, y: exit.y });
                    pts.push({ x: target.x, y: target.y });
                } else {
                    if (Math.abs(exit.x - target.x) < 0.5) {
                        pts.push({ x: target.x, y: target.y });
                    } else {
                        const midY = exit.y + (target.y - exit.y) / 2;
                        pts.push({ x: exit.x, y: midY });
                        pts.push({ x: target.x, y: midY });
                        pts.push({ x: target.x, y: target.y });
                    }
                }

                return {
                    points: pts,
                    arrow: arrowAtEnd,
                    label: exit.label || null,
                    labelPos: exit.labelPos || null
                };
            }

            layoutNode(node) {
                switch (node.type) {
                    case 'if':
                        return this.layoutIf(node);
                    case 'while':
                        return this.layoutWhile(node);
                    case 'for':
                        return this.forAsHexagon ? this.layoutForHexagon(node) : this.layoutWhile({
                            ...node,
                            condition: node.header
                        });
                    case 'doWhile':
                        return this.layoutDoWhile(node);
                    default:
                        return this.layoutSimple(node);
                }
            }

            layoutSimple(node) {
                const { w, h, lines } = this.getNodeDimensions(node);
                const shape = {
                    id: node.id,
                    type: node.type,
                    ioKind: node.ioKind,
                    cx: 0,
                    y: 0,
                    w,
                    h,
                    lines,
                    line: node.line
                };

                return {
                    leftExtent: w / 2 + 15,
                    rightExtent: w / 2 + 15,
                    height: h,
                    shapes: [shape],
                    edges: [],
                    openExits: node.type === 'return' ? [] : [{ x: 0, y: h, dir: 'down' }]
                };
            }

            // IF / ELSE Decision Layout
            layoutIf(node) {
                const { w, h, lines } = this.getNodeDimensions(node);
                const diamond = {
                    id: node.id,
                    type: 'decision',
                    cx: 0,
                    y: 0,
                    w,
                    h,
                    lines,
                    line: node.line
                };

                const thenBlock = this.layoutSequence(node.thenBranch);
                const hasElse = node.elseBranch && node.elseBranch.length > 0;
                const elseBlock = hasElse ? this.layoutSequence(node.elseBranch) : null;

                const shapes = [diamond];
                const edges = [];

                const branchTopY = h + this.vGap;

                if (!hasElse) {
                    // Single 'Да' branch straight down, 'Нет' bypasses on the right
                    this.translateBlock(thenBlock, 0, branchTopY);
                    shapes.push(...thenBlock.shapes);
                    edges.push(...thenBlock.edges);

                    // Edge from bottom of diamond ('Да') to top of thenBlock
                    edges.push({
                        points: [{ x: 0, y: h }, { x: 0, y: branchTopY }],
                        arrow: true,
                        label: 'Да',
                        labelPos: { x: 14, y: h + 16 }
                    });

                    const mergeY = branchTopY + thenBlock.height + this.vGap;
                    const rightBypassX = Math.max(w / 2, thenBlock.rightExtent) + 42;

                    // Connect thenBlock openExits to merge point (0, mergeY)
                    for (const ex of thenBlock.openExits) {
                        edges.push({
                            points: [
                                { x: ex.x, y: ex.y },
                                { x: ex.x, y: mergeY },
                                { x: 0, y: mergeY }
                            ],
                            arrow: false
                        });
                    }

                    // 'Нет' branch from right tip of diamond around to merge point
                    edges.push({
                        points: [
                            { x: w / 2, y: h / 2 },
                            { x: rightBypassX, y: h / 2 },
                            { x: rightBypassX, y: mergeY },
                            { x: 0, y: mergeY }
                        ],
                        arrow: false,
                        label: 'Нет',
                        labelPos: { x: w / 2 + 22, y: h / 2 - 8 }
                    });

                    return {
                        leftExtent: Math.max(w / 2 + 20, thenBlock.leftExtent),
                        rightExtent: rightBypassX + 24,
                        height: mergeY,
                        shapes,
                        edges,
                        openExits: [{ x: 0, y: mergeY, dir: 'down' }]
                    };
                } else {
                    // Both 'Да' (Left) and 'Нет' (Right) branches present
                    const leftOffset = -(Math.max(w / 2 + 25, thenBlock.rightExtent + this.hGap / 2));
                    const rightOffset = Math.max(w / 2 + 25, elseBlock.leftExtent + this.hGap / 2);

                    this.translateBlock(thenBlock, leftOffset, branchTopY);
                    this.translateBlock(elseBlock, rightOffset, branchTopY);

                    shapes.push(...thenBlock.shapes, ...elseBlock.shapes);
                    edges.push(...thenBlock.edges, ...elseBlock.edges);

                    // Left 'Да' connector from left tip of diamond
                    edges.push({
                        points: [
                            { x: -w / 2, y: h / 2 },
                            { x: leftOffset, y: h / 2 },
                            { x: leftOffset, y: branchTopY }
                        ],
                        arrow: true,
                        label: 'Да',
                        labelPos: { x: -w / 2 - 22, y: h / 2 - 8 }
                    });

                    // Right 'Нет' connector from right tip of diamond
                    edges.push({
                        points: [
                            { x: w / 2, y: h / 2 },
                            { x: rightOffset, y: h / 2 },
                            { x: rightOffset, y: branchTopY }
                        ],
                        arrow: true,
                        label: 'Нет',
                        labelPos: { x: w / 2 + 22, y: h / 2 - 8 }
                    });

                    const maxBranchH = Math.max(thenBlock.height, elseBlock.height);
                    const mergeY = branchTopY + maxBranchH + this.vGap;

                    const activeExits = [...thenBlock.openExits, ...elseBlock.openExits];
                    for (const ex of activeExits) {
                        edges.push({
                            points: [
                                { x: ex.x, y: ex.y },
                                { x: ex.x, y: mergeY },
                                { x: 0, y: mergeY }
                            ],
                            arrow: false
                        });
                    }

                    return {
                        leftExtent: Math.abs(leftOffset) + thenBlock.leftExtent + 20,
                        rightExtent: rightOffset + elseBlock.rightExtent + 20,
                        height: mergeY,
                        shapes,
                        edges,
                        openExits: activeExits.length > 0 ? [{ x: 0, y: mergeY, dir: 'down' }] : []
                    };
                }
            }

            // WHILE Loop Layout (Pre-condition diamond + loop-back arrow on left + exit on right)
            layoutWhile(node) {
                const { w, h, lines } = this.getNodeDimensions(node);
                const topEntryLead = 22; // Space above diamond for loop-back arrow
                const diamondY = topEntryLead;

                const diamond = {
                    id: node.id,
                    type: 'decision',
                    cx: 0,
                    y: diamondY,
                    w,
                    h,
                    lines,
                    line: node.line
                };

                const bodyBlock = this.layoutSequence(node.body);
                const bodyTopY = diamondY + h + this.vGap;
                this.translateBlock(bodyBlock, 0, bodyTopY);

                const shapes = [diamond, ...bodyBlock.shapes];
                const edges = [
                    // Lead line into diamond
                    {
                        points: [{ x: 0, y: 0 }, { x: 0, y: diamondY }],
                        arrow: true
                    },
                    // 'Да' into loop body
                    {
                        points: [{ x: 0, y: diamondY + h }, { x: 0, y: bodyTopY }],
                        arrow: true,
                        label: 'Да',
                        labelPos: { x: 15, y: diamondY + h + 16 }
                    },
                    ...bodyBlock.edges
                ];

                const loopBottomY = bodyTopY + bodyBlock.height + 24;
                const leftLoopBackX = -(Math.max(w / 2, bodyBlock.leftExtent) + 38);
                const rightExitX = Math.max(w / 2, bodyBlock.rightExtent) + 38;
                const exitMergeY = loopBottomY + 26;

                // Connect body exits to the left loop-back channel returning above diamond
                for (const ex of bodyBlock.openExits) {
                    edges.push({
                        points: [
                            { x: ex.x, y: ex.y },
                            { x: ex.x, y: loopBottomY },
                            { x: leftLoopBackX, y: loopBottomY },
                            { x: leftLoopBackX, y: topEntryLead / 2 },
                            { x: 0, y: topEntryLead / 2 }
                        ],
                        arrow: true
                    });
                }

                // 'Нет' exit from right tip of diamond around loop body to bottom center
                edges.push({
                    points: [
                        { x: w / 2, y: diamondY + h / 2 },
                        { x: rightExitX, y: diamondY + h / 2 },
                        { x: rightExitX, y: exitMergeY },
                        { x: 0, y: exitMergeY }
                    ],
                    arrow: false,
                    label: 'Нет',
                    labelPos: { x: w / 2 + 22, y: diamondY + h / 2 - 8 }
                });

                return {
                    leftExtent: Math.abs(leftLoopBackX) + 22,
                    rightExtent: rightExitX + 22,
                    height: exitMergeY,
                    shapes,
                    edges,
                    openExits: [{ x: 0, y: exitMergeY, dir: 'down' }]
                };
            }

            // GOST 19.701-90 Hexagon Loop Layout (for loop)
            layoutForHexagon(node) {
                const { w, h, lines } = this.getNodeDimensions(node);
                const hex = {
                    id: node.id,
                    type: 'forHexagon',
                    cx: 0,
                    y: 0,
                    w,
                    h,
                    lines,
                    line: node.line
                };

                const bodyBlock = this.layoutSequence(node.body);
                const bodyTopY = h + this.vGap;
                this.translateBlock(bodyBlock, 0, bodyTopY);

                const shapes = [hex, ...bodyBlock.shapes];
                const edges = [
                    {
                        points: [{ x: 0, y: h }, { x: 0, y: bodyTopY }],
                        arrow: true
                    },
                    ...bodyBlock.edges
                ];

                const loopBottomY = bodyTopY + bodyBlock.height + 24;
                const leftLoopBackX = -(Math.max(w / 2, bodyBlock.leftExtent) + 38);
                const rightExitX = Math.max(w / 2, bodyBlock.rightExtent) + 38;
                const exitMergeY = loopBottomY + 26;

                // Loop back from bottom of body into the left tip of the GOST hexagon
                for (const ex of bodyBlock.openExits) {
                    edges.push({
                        points: [
                            { x: ex.x, y: ex.y },
                            { x: ex.x, y: loopBottomY },
                            { x: leftLoopBackX, y: loopBottomY },
                            { x: leftLoopBackX, y: h / 2 },
                            { x: -w / 2, y: h / 2 }
                        ],
                        arrow: true
                    });
                }

                // Exit loop from right tip of hexagon down to bottom merge point
                edges.push({
                    points: [
                        { x: w / 2, y: h / 2 },
                        { x: rightExitX, y: h / 2 },
                        { x: rightExitX, y: exitMergeY },
                        { x: 0, y: exitMergeY }
                    ],
                    arrow: false
                });

                return {
                    leftExtent: Math.abs(leftLoopBackX) + 22,
                    rightExtent: rightExitX + 22,
                    height: exitMergeY,
                    shapes,
                    edges,
                    openExits: [{ x: 0, y: exitMergeY, dir: 'down' }]
                };
            }

            // DO-WHILE Loop Layout (Post-condition diamond at bottom)
            layoutDoWhile(node) {
                const topEntryLead = 24;
                const bodyBlock = this.layoutSequence(node.body);
                this.translateBlock(bodyBlock, 0, topEntryLead);

                const { w, h, lines } = this.getNodeDimensions(node);
                const diamondY = topEntryLead + bodyBlock.height + this.vGap;

                const diamond = {
                    id: node.id,
                    type: 'decision',
                    cx: 0,
                    y: diamondY,
                    w,
                    h,
                    lines,
                    line: node.line
                };

                const shapes = [...bodyBlock.shapes, diamond];
                const edges = [
                    {
                        points: [{ x: 0, y: 0 }, { x: 0, y: topEntryLead }],
                        arrow: true
                    },
                    ...bodyBlock.edges
                ];

                for (const ex of bodyBlock.openExits) {
                    edges.push(this.connectExitToPoint(ex, { x: 0, y: diamondY }, true));
                }

                const leftLoopBackX = -(Math.max(w / 2, bodyBlock.leftExtent) + 38);

                // 'Да' loops back from left tip of diamond to top entry
                edges.push({
                    points: [
                        { x: -w / 2, y: diamondY + h / 2 },
                        { x: leftLoopBackX, y: diamondY + h / 2 },
                        { x: leftLoopBackX, y: topEntryLead / 2 },
                        { x: 0, y: topEntryLead / 2 }
                    ],
                    arrow: true,
                    label: 'Да',
                    labelPos: { x: -w / 2 - 22, y: diamondY + h / 2 - 8 }
                });

                const bottomExitY = diamondY + h + this.vGap;
                edges.push({
                    points: [
                        { x: 0, y: diamondY + h },
                        { x: 0, y: bottomExitY }
                    ],
                    arrow: false,
                    label: 'Нет',
                    labelPos: { x: 18, y: diamondY + h + 16 }
                });

                return {
                    leftExtent: Math.abs(leftLoopBackX) + 22,
                    rightExtent: Math.max(w / 2, bodyBlock.rightExtent) + 24,
                    height: bottomExitY,
                    shapes,
                    edges,
                    openExits: [{ x: 0, y: bottomExitY, dir: 'down' }]
                };
            }
        }

        /********************************************************************
         * 4. SVG RENDERER (GOST B/W & MODERN COLOR THEMES)
         ********************************************************************/
        class FlowchartRenderer {
            constructor(svgElement, viewportGroup, defsElement) {
                this.svg = svgElement;
                this.group = viewportGroup;
                this.defs = defsElement;
            }

            render(layout, theme = 'modern', onNodeClick = null) {
                this.group.innerHTML = '';
                this.defs.innerHTML = '';

                const isGost = theme === 'gost';
                const strokeColor = isGost ? '#000000' : '#334155';
                const strokeWidth = isGost ? 2 : 1.8;
                const fontFamily = isGost ? "'PT Serif', 'Times New Roman', serif" : "'Inter', sans-serif";

                // Define arrowhead marker
                const marker = document.createElementNS('http://www.w3.org/2000/svg', 'marker');
                marker.setAttribute('id', 'arrowhead');
                marker.setAttribute('viewBox', '0 0 10 10');
                marker.setAttribute('refX', '9');
                marker.setAttribute('refY', '5');
                marker.setAttribute('markerWidth', '6.5');
                marker.setAttribute('markerHeight', '6.5');
                marker.setAttribute('orient', 'auto-start-reverse');

                const arrowPath = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                arrowPath.setAttribute('d', 'M 0 1.5 L 10 5 L 0 8.5 z');
                arrowPath.setAttribute('fill', strokeColor);
                marker.appendChild(arrowPath);
                this.defs.appendChild(marker);

                // Drop shadow filter for modern theme
                if (!isGost) {
                    const filter = document.createElementNS('http://www.w3.org/2000/svg', 'filter');
                    filter.setAttribute('id', 'nodeShadow');
                    filter.setAttribute('x', '-10%');
                    filter.setAttribute('y', '-10%');
                    filter.setAttribute('width', '120%');
                    filter.setAttribute('height', '130%');
                    filter.innerHTML = `<feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.08"/>`;
                    this.defs.appendChild(filter);
                }

                // 1. Draw Connector Edges first
                for (const edge of layout.edges) {
                    if (!edge.points || edge.points.length < 2) continue;

                    const d = edge.points.map((pt, idx) =>
                        `${idx === 0 ? 'M' : 'L'} ${pt.x.toFixed(1)} ${pt.y.toFixed(1)}`
                    ).join(' ');

                    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                    path.setAttribute('d', d);
                    path.setAttribute('fill', 'none');
                    path.setAttribute('stroke', strokeColor);
                    path.setAttribute('stroke-width', strokeWidth);
                    path.setAttribute('stroke-linejoin', 'round');
                    path.setAttribute('stroke-linecap', 'round');
                    if (edge.arrow) {
                        path.setAttribute('marker-end', 'url(#arrowhead)');
                    }
                    this.group.appendChild(path);

                    // Yes / No ("Да" / "Нет") label
                    if (edge.label && edge.labelPos) {
                        const lbl = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        lbl.setAttribute('x', edge.labelPos.x);
                        lbl.setAttribute('y', edge.labelPos.y);
                        lbl.setAttribute('text-anchor', 'middle');
                        lbl.setAttribute('font-family', fontFamily);
                        lbl.setAttribute('font-size', isGost ? '13px' : '12px');
                        lbl.setAttribute('font-weight', isGost ? 'normal' : '600');
                        lbl.setAttribute('fill', isGost ? '#000000' : (edge.label === 'Да' ? '#15803d' : '#b91c1c'));
                        lbl.textContent = edge.label;
                        this.group.appendChild(lbl);
                    }
                }

                // 2. Draw Flowchart Shapes
                for (const s of layout.shapes) {
                    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
                    g.setAttribute('class', 'node-hover');
                    if (!isGost) g.setAttribute('filter', 'url(#nodeShadow)');

                    if (onNodeClick && s.line) {
                        g.addEventListener('click', (e) => {
                            e.stopPropagation();
                            onNodeClick(s.line);
                        });
                    }

                    const style = this.getShapePalette(s.type, isGost);
                    const x = s.cx - s.w / 2;
                    const y = s.y;
                    const w = s.w;
                    const h = s.h;

                    // Create specific GOST shape geometry
                    if (s.type === 'terminator' || s.type === 'return') {
                        // Rounded stadium / pill shape
                        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                        rect.setAttribute('x', x);
                        rect.setAttribute('y', y);
                        rect.setAttribute('width', w);
                        rect.setAttribute('height', h);
                        rect.setAttribute('rx', h / 2);
                        rect.setAttribute('ry', h / 2);
                        this.applyShapeAttrs(rect, style, strokeWidth);
                        g.appendChild(rect);
                    } else if (s.type === 'io') {
                        // Parallelogram (skewed 18px)
                        const skew = 16;
                        const pts = [
                            `${x + skew},${y}`,
                            `${x + w},${y}`,
                            `${x + w - skew},${y + h}`,
                            `${x},${y + h}`
                        ].join(' ');
                        const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                        poly.setAttribute('points', pts);
                        this.applyShapeAttrs(poly, style, strokeWidth);
                        g.appendChild(poly);
                    } else if (s.type === 'decision') {
                        // Rhombus / Diamond
                        const pts = [
                            `${s.cx},${y}`,
                            `${x + w},${y + h / 2}`,
                            `${s.cx},${y + h}`,
                            `${x},${y + h / 2}`
                        ].join(' ');
                        const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                        poly.setAttribute('points', pts);
                        this.applyShapeAttrs(poly, style, strokeWidth);
                        g.appendChild(poly);
                    } else if (s.type === 'forHexagon') {
                        // Hexagon (Цикл с параметром / Модификация по ГОСТ)
                        const tip = 22;
                        const pts = [
                            `${x + tip},${y}`,
                            `${x + w - tip},${y}`,
                            `${x + w},${y + h / 2}`,
                            `${x + w - tip},${y + h}`,
                            `${x + tip},${y + h}`,
                            `${x},${y + h / 2}`
                        ].join(' ');
                        const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
                        poly.setAttribute('points', pts);
                        this.applyShapeAttrs(poly, style, strokeWidth);
                        g.appendChild(poly);
                    } else if (s.type === 'subprogram') {
                        // Predefined Process (Rectangle with double vertical sidebars)
                        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                        rect.setAttribute('x', x);
                        rect.setAttribute('y', y);
                        rect.setAttribute('width', w);
                        rect.setAttribute('height', h);
                        this.applyShapeAttrs(rect, style, strokeWidth);
                        g.appendChild(rect);

                        const inset = 12;
                        for (const lx of [x + inset, x + w - inset]) {
                            const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                            line.setAttribute('x1', lx);
                            line.setAttribute('y1', y);
                            line.setAttribute('x2', lx);
                            line.setAttribute('y2', y + h);
                            line.setAttribute('stroke', style.stroke);
                            line.setAttribute('stroke-width', strokeWidth);
                            g.appendChild(line);
                        }
                    } else {
                        // Standard Process Rectangle
                        const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
                        rect.setAttribute('x', x);
                        rect.setAttribute('y', y);
                        rect.setAttribute('width', w);
                        rect.setAttribute('height', h);
                        rect.setAttribute('rx', isGost ? 0 : 4);
                        this.applyShapeAttrs(rect, style, strokeWidth);
                        g.appendChild(rect);
                    }

                    // Render multi-line centered text inside the node
                    const lineHeight = 16;
                    const totalTextH = (s.lines.length - 1) * lineHeight;
                    const startY = y + h / 2 - totalTextH / 2 + 4.5;

                    s.lines.forEach((lineStr, idx) => {
                        const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
                        txt.setAttribute('x', s.cx);
                        txt.setAttribute('y', startY + idx * lineHeight);
                        txt.setAttribute('text-anchor', 'middle');
                        txt.setAttribute('font-family', fontFamily);
                        txt.setAttribute('font-size', isGost ? '13.5px' : '12.5px');
                        txt.setAttribute('font-weight', (s.type === 'terminator' && !isGost) ? '600' : 'normal');
                        txt.setAttribute('fill', style.text);
                        txt.textContent = lineStr;
                        g.appendChild(txt);
                    });

                    this.group.appendChild(g);
                }
            }

            applyShapeAttrs(el, style, strokeWidth) {
                el.setAttribute('fill', style.fill);
                el.setAttribute('stroke', style.stroke);
                el.setAttribute('stroke-width', strokeWidth);
            }

            getShapePalette(type, isGost) {
                if (isGost) {
                    return {
                        fill: '#ffffff',
                        stroke: '#000000',
                        text: '#000000'
                    };
                }
                switch (type) {
                    case 'terminator':
                    case 'return':
                        return { fill: '#eef2ff', stroke: '#4f46e5', text: '#1e1b4b' };
                    case 'io':
                        return { fill: '#ecfdf5', stroke: '#059669', text: '#064e3b' };
                    case 'decision':
                        return { fill: '#fffbeb', stroke: '#d97706', text: '#78350f' };
                    case 'forHexagon':
                        return { fill: '#f5f3ff', stroke: '#7c3aed', text: '#4c1d95' };
                    case 'subprogram':
                        return { fill: '#f0f9ff', stroke: '#0284c7', text: '#0c4a6e' };
                    default:
                        return { fill: '#ffffff', stroke: '#475569', text: '#0f172a' };
                }
            }
        }

        /********************************************************************
         * 5. MERMAID CODE GENERATOR
         ********************************************************************/
        class MermaidExporter {
            generate(parsedMethod) {
                this.lines = ['flowchart TD'];
                this.counter = 1;
                const startId = 'Start([Начало])';
                const endId = 'EndNode([Конец])';

                const lastExits = this.walkSequence(parsedMethod.body, ['Start']);
                for (const ex of lastExits) {
                    this.lines.push(`    ${ex.id} ${ex.label ? `-- "${ex.label}" -->` : '-->'} ${endId}`);
                }

                // Ensure Start has its definition
                if (this.lines.length > 1) {
                    this.lines[1] = this.lines[1].replace(/^(\s*)Start\b/, `$1${startId}`);
                } else {
                    this.lines.push(`    ${startId} --> ${endId}`);
                }
                return this.lines.join('\n');
            }

            esc(str) {
                return (str || '').replace(/"/g, "'");
            }

            walkSequence(nodes, incoming) {
                let currentIn = incoming;
                for (const n of nodes) {
                    currentIn = this.walkNode(n, currentIn);
                }
                return currentIn;
            }

            connectIncoming(incoming, targetDef) {
                for (const inc of incoming) {
                    const arrow = inc.label ? `-- "${inc.label}" -->` : '-->';
                    this.lines.push(`    ${inc.id} ${arrow} ${targetDef}`);
                }
            }

            walkNode(n, incoming) {
                const id = `N${this.counter++}`;
                if (n.type === 'if') {
                    const def = `${id}{"${this.esc(n.condition)}"}`;
                    this.connectIncoming(incoming, def);
                    const thenExits = this.walkSequence(n.thenBranch, [{ id, label: 'Да' }]);
                    const elseExits = (n.elseBranch && n.elseBranch.length > 0)
                        ? this.walkSequence(n.elseBranch, [{ id, label: 'Нет' }])
                        : [{ id, label: 'Нет' }];
                    return [...thenExits, ...elseExits];
                }
                if (n.type === 'while' || n.type === 'for') {
                    const cond = n.type === 'for' ? n.header : n.condition;
                    const def = `${id}{"${this.esc(cond)}"}`;
                    this.connectIncoming(incoming, def);
                    const bodyExits = this.walkSequence(n.body, [{ id, label: 'Да' }]);
                    for (const be of bodyExits) {
                        this.lines.push(`    ${be.id} ${be.label ? `-- "${be.label}" -->` : '-->'} ${id}`);
                    }
                    return [{ id, label: 'Нет' }];
                }
                if (n.type === 'doWhile') {
                    const startId = `DW${this.counter++}[/"Начало цикла"/]`;
                    this.connectIncoming(incoming, startId);
                    const bodyExits = this.walkSequence(n.body, [{ id: startId.split('[')[0] }]);
                    const condDef = `${id}{"${this.esc(n.condition)}"}`;
                    this.connectIncoming(bodyExits, condDef);
                    this.lines.push(`    ${id} -- "Да" --> ${startId.split('[')[0]}`);
                    return [{ id, label: 'Нет' }];
                }
                if (n.type === 'io') {
                    const def = `${id}[/"${this.esc(n.text)}"/]`;
                    this.connectIncoming(incoming, def);
                    return [{ id }];
                }
                if (n.type === 'return') {
                    const def = `${id}(["${this.esc(n.text)}"])`;
                    this.connectIncoming(incoming, def);
                    return [];
                }
                const def = `${id}["${this.esc(n.text)}"]`;
                this.connectIncoming(incoming, def);
                return [{ id }];
            }
        }

        /********************************************************************
         * 6. APPLICATION CONTROLLER, MOBILE TABS & TOUCH GESTURES
         ********************************************************************/
        const codeInput = document.getElementById('codeInput');
        const lineNumbers = document.getElementById('lineNumbers');
        const presetSelect = document.getElementById('presetSelect');
        const methodSelect = document.getElementById('methodSelect');
        const btnThemeToggle = document.getElementById('btnThemeToggle');
        const themeIndicator = document.getElementById('themeIndicator');
        const themeLabel = document.getElementById('themeLabel');
        const btnHexToggle = document.getElementById('btnHexToggle');

        const tabCode = document.getElementById('tabCode');
        const tabChart = document.getElementById('tabChart');
        const codePanel = document.getElementById('codePanel');
        const chartPanel = document.getElementById('chartPanel');
        const btnMobileBuild = document.getElementById('btnMobileBuild');
        const btnClearCode = document.getElementById('btnClearCode');
        const lineToast = document.getElementById('lineToast');

        const canvasViewport = document.getElementById('canvasViewport');
        const flowchartSvg = document.getElementById('flowchartSvg');
        const viewportGroup = document.getElementById('viewportGroup');
        const svgDefs = document.getElementById('svgDefs');

        const parser = new JavaParser();
        const renderer = new FlowchartRenderer(flowchartSvg, viewportGroup, svgDefs);

        let extractedMethods = [];
        let currentParsedMethod = null;
        let currentLayout = null;
        let currentTheme = 'modern'; // 'modern' | 'gost'
        let forAsHexagon = true;
        let activeMobileTab = 'code'; // 'code' | 'chart'

        // Pan & Zoom State
        let panX = 0;
        let panY = 0;
        let scale = 1;
        let isDragging = false;
        let dragStartX = 0;
        let dragStartY = 0;

        function setMobileTab(tab) {
            activeMobileTab = tab;
            if (window.innerWidth >= 768) return;

            if (tab === 'code') {
                codePanel.classList.remove('hidden');
                codePanel.classList.add('flex');
                chartPanel.classList.add('hidden');
                chartPanel.classList.remove('flex');
                tabCode.className = 'px-3 py-1.5 rounded-md text-xs font-semibold bg-indigo-600 text-white transition shrink-0';
                tabChart.className = 'px-3 py-1.5 rounded-md text-xs font-semibold text-slate-400 hover:text-white transition shrink-0';
            } else {
                codePanel.classList.add('hidden');
                codePanel.classList.remove('flex');
                chartPanel.classList.remove('hidden');
                chartPanel.classList.add('flex');
                tabChart.className = 'px-3 py-1.5 rounded-md text-xs font-semibold bg-indigo-600 text-white transition shrink-0';
                tabCode.className = 'px-3 py-1.5 rounded-md text-xs font-semibold text-slate-400 hover:text-white transition shrink-0';
                requestAnimationFrame(() => fitDiagramToViewport());
            }
        }

        tabCode.addEventListener('click', () => setMobileTab('code'));
        tabChart.addEventListener('click', () => {
            compileAndRender(false);
            setMobileTab('chart');
        });
        btnMobileBuild.addEventListener('click', () => {
            compileAndRender(true);
            setMobileTab('chart');
        });
        btnClearCode.addEventListener('click', () => {
            codeInput.value = '';
            updateLineNumbers();
            compileAndRender(true);
            codeInput.focus();
        });

        function updateLineNumbers() {
            const linesCount = (codeInput.value.match(/\n/g) || []).length + 1;
            let html = '';
            for (let i = 1; i <= linesCount; i++) {
                html += `<div>${i}</div>`;
            }
            lineNumbers.innerHTML = html;
        }

        codeInput.addEventListener('scroll', () => {
            lineNumbers.scrollTop = codeInput.scrollTop;
        });

        let toastTimer = null;
        function highlightLineInEditor(lineNumber) {
            if (!lineNumber) return;
            const lines = codeInput.value.split('\n');
            let charIndex = 0;
            for (let i = 0; i < lineNumber - 1 && i < lines.length; i++) {
                charIndex += lines[i].length + 1;
            }
            const lineLen = (lines[lineNumber - 1] || '').length;

            if (window.innerWidth < 768) {
                const codeSnippet = (lines[lineNumber - 1] || '').trim().slice(0, 32);
                lineToast.textContent = `Стр. ${lineNumber}: ${codeSnippet}`;
                lineToast.classList.remove('opacity-0');
                clearTimeout(toastTimer);
                toastTimer = setTimeout(() => lineToast.classList.add('opacity-0'), 1800);
            } else {
                codeInput.focus();
                codeInput.setSelectionRange(charIndex, charIndex + lineLen);
                const lineHeight = 24;
                codeInput.scrollTop = Math.max(0, (lineNumber - 5) * lineHeight);
            }
        }

        function compileAndRender(resetCamera = false) {
            try {
                const rawCode = codeInput.value;
                extractedMethods = parser.extractMethods(rawCode);

                if (extractedMethods.length > 1) {
                    methodSelect.classList.remove('hidden');
                    const prevIdx = methodSelect.selectedIndex >= 0 ? methodSelect.selectedIndex : 0;
                    methodSelect.innerHTML = extractedMethods
                        .map((m, idx) => `<option value="${idx}">${m.shortName}()</option>`)
                        .join('');
                    methodSelect.selectedIndex = Math.min(prevIdx, extractedMethods.length - 1);
                } else {
                    methodSelect.classList.add('hidden');
                }

                const selectedIdx = extractedMethods.length > 1 ? (parseInt(methodSelect.value, 10) || 0) : 0;
                const targetMethod = extractedMethods[selectedIdx] || extractedMethods[0];

                currentParsedMethod = parser.parseMethod(targetMethod);

                const layoutEngine = new FlowchartLayoutEngine({
                    forAsHexagon: forAsHexagon
                });
                currentLayout = layoutEngine.buildCompleteFlowchart(currentParsedMethod);

                canvasViewport.className = `flex-1 relative overflow-hidden touch-none cursor-grab active:cursor-grabbing ${
                    currentTheme === 'gost' ? 'canvas-grid-gost' : 'canvas-grid-modern'
                }`;

                renderer.render(currentLayout, currentTheme, highlightLineInEditor);

                if (resetCamera) {
                    fitDiagramToViewport();
                } else {
                    applyTransform();
                }
            } catch (err) {
                console.error(err);
            }
        }

        function applyTransform() {
            viewportGroup.setAttribute('transform', `translate(${panX}, ${panY}) scale(${scale})`);
            document.getElementById('zoomLabel').textContent = `${Math.round(scale * 100)}%`;
        }

        function fitDiagramToViewport() {
            if (!currentLayout) return;
            const rect = canvasViewport.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return;

            const pad = window.innerWidth < 768 ? 20 : 36;
            const scaleX = (rect.width - pad * 2) / currentLayout.width;
            const scaleY = (rect.height - pad * 2) / currentLayout.height;
            scale = Math.min(1.15, Math.max(0.25, Math.min(scaleX, scaleY)));

            panX = (rect.width - currentLayout.width * scale) / 2;
            panY = Math.max(16, (rect.height - currentLayout.height * scale) / 2);
            applyTransform();
        }

        // Mouse Pan & Wheel Zoom
        canvasViewport.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            isDragging = true;
            dragStartX = e.clientX - panX;
            dragStartY = e.clientY - panY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            panX = e.clientX - dragStartX;
            panY = e.clientY - dragStartY;
            applyTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvasViewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
            const newScale = Math.min(3.5, Math.max(0.18, scale * zoomFactor));

            const rect = canvasViewport.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            panX = mouseX - (mouseX - panX) * (newScale / scale);
            panY = mouseY - (mouseY - panY) * (newScale / scale);
            scale = newScale;
            applyTransform();
        }, { passive: false });

        // Mobile Touch Gestures: 1-Finger Pan & 2-Finger Pinch-to-Zoom
        let touchMode = null;
        let lastTouchX = 0;
        let lastTouchY = 0;
        let initialPinchDist = 0;
        let initialPinchScale = 1;

        function getTouchDist(t1, t2) {
            return Math.hypot(t2.clientX - t1.clientX, t2.clientY - t1.clientY);
        }

        canvasViewport.addEventListener('touchstart', (e) => {
            if (e.touches.length === 1) {
                touchMode = 'pan';
                lastTouchX = e.touches[0].clientX - panX;
                lastTouchY = e.touches[0].clientY - panY;
            } else if (e.touches.length === 2) {
                touchMode = 'pinch';
                initialPinchDist = getTouchDist(e.touches[0], e.touches[1]);
                initialPinchScale = scale;
            }
        }, { passive: true });

        canvasViewport.addEventListener('touchmove', (e) => {
            e.preventDefault();
            if (touchMode === 'pan' && e.touches.length === 1) {
                panX = e.touches[0].clientX - lastTouchX;
                panY = e.touches[0].clientY - lastTouchY;
                applyTransform();
            } else if (touchMode === 'pinch' && e.touches.length === 2) {
